name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 3:00 AM UTC — comfortably under Supabase's 7-day pause window
    - cron: "0 3 */3 * *"
  workflow_dispatch: # lets you also trigger it manually from GitHub's UI to test

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          curl "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
